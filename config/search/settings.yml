use_default_settings: true
server:
  secret_key: "mova-loopback-local-search-not-public"
  limiter: false
  image_proxy: false
search:
  formats:
    - html
    - json
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
engines:
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
